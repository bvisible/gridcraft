[package]
name = "gridcraft-web"
description = "GridCraft in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "gridcraft-web"
path = "src/main.rs"

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
# The page command API (storytold/craft-libs#413): window.gridcraft over the control channel.
craft-web-api = { git = "https://github.com/storytold/craft-libs", rev = "fd5e2feff6ea25bed371a99cc732b3968d621505", version = "0.1.0" }
# //// Neoffice — upstream's `craft-web-host` (the host messages and the two transports of its bridge, v0.19.0) is not a dependency here:
# the bridge of this build is our host.rs, whose `gridcraft:saved` and refusals the crate's does not have. Add it back only if
# upstream's bridge is ever taken whole again.
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# //// Neoffice — Headers, Request, RequestInit, RequestCredentials and Response are for the Nora pane's `fetch` (src/nora.rs); the rest is upstream's list (MessageEvent and UrlSearchParams came with its host bridge in v0.7.0, AddEventListenerOptions and Storage with its print clean-up and preferences in v0.11, Event, EventTarget, CustomEvent and CustomEventInit with `craft-web-host`'s DOM transport in v0.19.0).
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Clipboard", "ClipboardItem", "Navigator", "MessageEvent", "UrlSearchParams", "AddEventListenerOptions", "Storage", "CustomEvent", "CustomEventInit", "Headers", "Request", "RequestInit", "RequestCredentials", "Response"] }
