# //// Neoffice — added file (no upstream equivalent)
# Why: upstream runs its quality gate (`cargo xtask ci`: format, clippy without warnings, tests,
# asset attribution, layering, wasm) on the author's machine only, and the maintainer's Mac has too
# little disk to do it for every change. This runs the same gate on a GitHub runner, by hand or on
# a push to version-15 that touches code. Upstream's own workflows are disabled on this fork.
name: Neoffice CI

on:
  workflow_dispatch:
  push:
    branches: [version-15]
    paths: ["crates/**", "apps/**", "xtask/**", "Cargo.toml", "Cargo.lock", ".github/workflows/neoffice-ci.yml"]

permissions:
  contents: read

concurrency:
  group: neoffice-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # //// Neoffice — 02.11 (v0.15.0 merge): upstream's own gate (craft-common-actions' gate.yml) tests with the craft-fonts it ships
      # and sets CRAFT_FONTS_REQUIRED=1 so that a build which silently drops them fails. Its tests draw "ẞ" and Vietnamese, which
      # egui's bundled Ubuntu Light lacks, and panic without the fonts. The same commit as neoffice-web.yml.
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: aced4137c022f1f587624d48e81ec77e1914a9cc
          path: craft-fonts
          persist-credentials: false
      - name: Linux build dependencies (winit, wgpu, rfd, audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: neoffice-ci
      - run: cargo xtask ci
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
